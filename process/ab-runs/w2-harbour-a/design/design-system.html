<!DOCTYPE html>
<html>
<head>
<title>Harbour Booking - Design System</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; }
h1 { color: #003d7a; }
.component { border: 1px solid #ddd; padding: 15px; margin: 10px 0; background: #f9f9f9; }
.color-swatch { width: 80px; height: 80px; display: inline-block; margin: 5px; }
</style>
</head>
<body>
<h1>Harbour Berth Booking - Design System</h1>
<h2>Color Palette</h2>
<div class="color-swatch" style="background: #003d7a;"></div> Primary Navy (#003d7a)
<div class="color-swatch" style="background: #2a85c7;"></div> Secondary Blue (#2a85c7)
<div class="color-swatch" style="background: #e74c3c;"></div> Accent Red (#e74c3c)
<div class="color-swatch" style="background: #f5f5f5;"></div> Light Gray (#f5f5f5)

<h2>Typography</h2>
<div class="component">
<p style="font-size: 14px;">Body text: Segoe UI, 14px, #333</p>
<h3 style="font-size: 18px; color: #003d7a;">Heading 3: Navy, 18px</h3>
<p style="font-size: 12px; color: #666;">Labels: Gray, 12px</p>
</div>

<h2>Components</h2>
<div class="component">
<button style="background: #003d7a; color: white; padding: 8px 16px; border: none; border-radius: 4px;">Primary Button</button>
<button style="background: #e74c3c; color: white; padding: 8px 16px; border: none; border-radius: 4px;">Danger Button</button>
</div>

<div class="component">
<input type="text" placeholder="Text input field" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 300px;">
</div>

<div class="component">
<table style="width: 100%; border-collapse: collapse;">
<tr style="background: #003d7a; color: white;">
<th style="padding: 8px; text-align: left;">Column 1</th>
<th style="padding: 8px; text-align: left;">Column 2</th>
<th style="padding: 8px; text-align: left;">Column 3</th>
</tr>
<tr style="border-bottom: 1px solid #ddd;">
<td style="padding: 8px;">Data 1</td>
<td style="padding: 8px;">Data 2</td>
<td style="padding: 8px;">Data 3</td>
</tr>
</table>
</div>

</body>
</html>
