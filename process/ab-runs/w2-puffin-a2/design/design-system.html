<!DOCTYPE html>
<html>
<head>
  <title>Design System - Puffin</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; margin: 20px; line-height: 1.6; }
    h1 { color: #0066cc; }
    .color-swatch { display: inline-block; width: 100px; height: 100px; margin: 10px; border: 1px solid #ccc; }
    .component { margin: 20px 0; padding: 15px; background: #f5f5f5; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Puffin Design System</h1>
  <h2>Color Palette</h2>
  <div class="color-swatch" style="background: #0066cc;"></div>Primary (#0066cc)<br>
  <div class="color-swatch" style="background: #f0f0f0;"></div>Background (#f0f0f0)<br>
  <div class="color-swatch" style="background: #e74c3c;"></div>Error (#e74c3c)<br>
  
  <h2>Typography</h2>
  <div class="component">
    <h3>Heading 1 (24px, bold)</h3>
    <h4>Heading 2 (18px, bold)</h4>
    <p>Body text (14px, regular)</p>
  </div>
  
  <h2>Components</h2>
  <div class="component">
    <button style="padding: 8px 16px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer;">Primary Button</button>
    <input type="text" placeholder="Text field" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-left: 10px;">
  </div>
  
  <p><em>Full design system TBD with designer review in Stage 3b</em></p>
</body>
</html>
