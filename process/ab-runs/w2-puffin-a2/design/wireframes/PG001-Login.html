<!DOCTYPE html>
<html>
<head>
  <title>Wireframe: Login</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    .wireframe { border: 1px solid #999; padding: 20px; width: 400px; }
    .box { border: 1px dashed #ccc; padding: 10px; margin: 10px 0; min-height: 20px; background: #fafafa; }
  </style>
</head>
<body>
  <h1>Wireframe: Login Page (PG-001)</h1>
  <div class="wireframe">
    <div class="box" style="text-align: center; font-weight: bold; font-size: 18px; height: 40px;">Puffin Dashboard Publisher</div>
    <div class="box" style="height: 200px;">
      <p><strong>Email</strong></p>
      <div style="border: 1px solid #ccc; padding: 8px; background: white;">user@example.com</div>
      <p><strong>Password</strong></p>
      <div style="border: 1px solid #ccc; padding: 8px; background: white;">••••••••</div>
    </div>
    <div class="box" style="text-align: center;">
      <button style="padding: 10px 20px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%;">Login</button>
    </div>
    <div class="box" style="text-align: center; font-size: 12px;">
      <a href="#">Forgot Password?</a>
    </div>
  </div>
</body>
</html>
