<!DOCTYPE html>
<html>
<head>
  <title>Wireframe: Dashboard List</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    .wireframe { border: 1px solid #999; padding: 20px; width: 600px; }
    .box { border: 1px dashed #ccc; padding: 10px; margin: 10px 0; background: #fafafa; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
  </style>
</head>
<body>
  <h1>Wireframe: Dashboard List (PG-001)</h1>
  <div class="wireframe">
    <div class="box" style="text-align: center; font-weight: bold; font-size: 16px;">Dashboard List</div>
    <div class="box">
      <button style="padding: 8px 16px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer;">Create New Dashboard</button>
      <button style="padding: 8px 16px; margin-left: 10px;">Refresh</button>
    </div>
    <div class="box">
      <table>
        <tr>
          <th>Title</th><th>State</th><th>Created</th><th>Actions</th>
        </tr>
        <tr>
          <td>Sales Overview</td><td>Published</td><td>2026-09-01</td><td>Edit | Delete</td>
        </tr>
        <tr>
          <td>Q3 Metrics Draft</td><td>Draft</td><td>2026-09-10</td><td>Edit | Delete</td>
        </tr>
      </table>
    </div>
  </div>
</body>
</html>
