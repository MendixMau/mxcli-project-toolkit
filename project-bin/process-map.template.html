<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<!-- GENERATED by project-bin/process-map.js from design/process-model.json, the BRDs, the
     wireframes and the question anchors. Never edit this file: edit the model and rebuild. -->
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#1a1d21; --muted:#5d6672; --faint:#8a929c; --line:#d8dde4;
  --lane:#eef1f5; --lane-sys:#e7eefb; --lane-sch:#efe9fb; --lane-ext:#f3f4f6;
  --accent:#1f5fd6; --accent-ink:#ffffff; --edge:#7d8794;
  --block:#c62828; --open:#b86e00; --dec:#6d3fc7; --ok:#2e7d32;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121417; --panel:#1b1e23; --ink:#e7e9ec; --muted:#a3abb5; --faint:#78818c; --line:#2f343b;
  --lane:#181b20; --lane-sys:#162033; --lane-sch:#1f1830; --lane-ext:#1c1e22;
  --accent:#6ea1ff; --accent-ink:#0b1220; --edge:#7c8693;
  --block:#ff6b6b; --open:#f0a03c; --dec:#a989ff; --ok:#6fcf73;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;
  padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.top .crumb{display:flex;gap:8px;align-items:baseline;min-width:0}
.top .crumb a{font-weight:650;text-decoration:none;color:var(--ink)}
.top .crumb .app{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toggle{display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:var(--panel);user-select:none}
.toggle input{accent-color:var(--block);margin:0}
.btn{padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn[hidden]{display:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
main{padding:16px;max-width:1600px;margin:0 auto}
main.wide{max-width:none}
main.wide>h1,main.wide>.lede,main.wide>.legend,main.wide>.back{max-width:1600px}
h1{font-size:22px;margin:4px 0 4px}
h2{font-size:16px;margin:28px 0 10px}
.lede{color:var(--muted);max-width:760px;margin:0 0 14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:12.5px;margin:6px 0 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.block{background:var(--block)} .dot.open{background:var(--open)} .dot.dec{background:var(--dec)}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:110px}
.stat b{display:block;font-size:22px;line-height:1.1}
.stat span{color:var(--muted);font-size:12px}
.stat.warn b{color:var(--block)}
/* index cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none;color:inherit;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.card:hover{border-color:var(--accent)}
.card h3{margin:0;font-size:15px}
.card p{margin:0;color:var(--muted);font-size:13px}
.card .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.mini{display:grid;gap:3px;padding:8px;background:var(--bg);border-radius:8px;overflow:hidden}
.mini i{display:block;height:10px;border-radius:2px}
.mini i.on{background:var(--accent);opacity:.75}
.mini i.on.sys{background:var(--faint)}
.mini i.on.dec{background:var(--dec)}
.mini i.on.hot{background:var(--block);opacity:1}
.mini em{font-style:normal;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:10px}
.pinrow{display:inline-flex;gap:6px;align-items:center}
.pc{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600}
.pc.block{color:var(--block)} .pc.open{color:var(--open)} .pc.dec{color:var(--dec)}
/* board */
.boardwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.board{position:relative;display:grid;padding:30px 40px 16px 0;min-width:min-content}
.board.long .step{width:150px;margin:8px 4px}
.board.long .step .thumb{display:none}
.board svg.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:1}
.board svg.labels{z-index:4}
.lanelabel{position:sticky;left:0;z-index:3;display:flex;align-items:center;padding:0 12px 0 16px;font-weight:650;font-size:13px;background:var(--panel);border-right:1px solid var(--line)}
.lanelabel small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.laneband{grid-column:1/-1;border-top:1px dashed var(--line);z-index:0}
.laneband.k-system{background:var(--lane-sys)} .laneband.k-scheduled{background:var(--lane-sch)} .laneband.k-external{background:var(--lane-ext)}
.step{position:relative;z-index:2;align-self:center;justify-self:center;width:260px;margin:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);cursor:pointer;text-align:left;padding:0;overflow:visible}
.step:hover,.step:focus-visible{border-color:var(--accent);outline:none}
.step.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.step .thumb{height:180px;overflow:hidden;border-radius:9px 9px 0 0;border-bottom:1px solid var(--line);background:var(--bg);position:relative}
.step .thumb iframe{width:640px;height:443px;border:0;transform:scale(.40625);transform-origin:0 0;pointer-events:none;background:#fff}
.step .thumb .nowf{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;padding:10px;text-align:center}
.step .body{padding:8px 10px 10px}
.step .n{font-size:11px;color:var(--faint);font-weight:600}
.step .t{font-weight:620;font-size:13.5px;line-height:1.3}
.step .pg{font:11.5px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);margin-top:3px;word-break:break-all}
.step .does{font-size:12px;color:var(--muted);margin-top:4px}
.status{display:inline-block;margin-top:6px;font-size:11.5px;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);font-weight:600}
.step.k-system,.step.k-end{border-style:dashed}
.step.k-system .icon,.step.k-decision .icon{display:inline-block;margin-right:4px}
.step.k-decision{border-color:var(--dec);border-width:1.5px}
.step.k-decision .t::before{content:"\25C7  ";color:var(--dec)}
.step.k-end{width:150px}
.step .xlink{display:inline-block;margin-top:6px;font-size:11.5px}
.pins{position:absolute;top:-10px;right:-8px;display:flex;gap:3px;z-index:4}
.pin{min-width:22px;height:22px;border-radius:11px;padding:0 6px;color:#fff;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.pin.block{background:var(--block)} .pin.open{background:var(--open)} .pin.dec{background:var(--dec)}
.edge{fill:none;stroke:var(--edge);stroke-width:1.6}
.edge.back{stroke-dasharray:5 4}
.elabel{font-size:11.5px;font-weight:600;fill:var(--ink)}
.elabelbg{fill:var(--panel);stroke:var(--line)}
/* click cues */
.howto{display:flex;align-items:center;gap:12px;margin:4px 0 14px;padding:12px 16px;border-radius:10px;background:color-mix(in srgb,var(--accent) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));font-size:16px;font-weight:600}
.howto .hand{font-size:24px;line-height:1}
.howto small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.step,.card{transition:transform .12s,box-shadow .12s,border-color .12s}
.step:hover,.card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.12)}
.step .opencue,.card .opencue{display:flex;justify-content:flex-end;align-items:center;gap:4px;margin-top:8px;padding-top:6px;border-top:1px solid var(--line);color:var(--accent);font-size:12.5px;font-weight:650}
.step.pulse{animation:pbpulse 1.6s ease-in-out infinite}
@keyframes pbpulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 0%,transparent)}}
@media (prefers-reduced-motion: reduce){.step.pulse{animation:none;box-shadow:0 0 0 3px var(--accent)}.step:hover,.card:hover{transform:none}}
/* lists */
.qlist{display:flex;flex-direction:column;gap:6px}
.q{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;width:100%}
.q:hover{border-color:var(--accent)}
.q .dot{margin-top:5px}
.q .qt{font-weight:600}
.q .qs{color:var(--muted);font-size:12.5px}
.q .where{color:var(--muted);font-size:12px;white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);margin-left:6px;font-weight:500}
details.more{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
details.more summary{cursor:pointer;font-weight:600}
table.uc{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:8px}
table.uc td{border-top:1px solid var(--line);padding:4px 6px;vertical-align:top}
/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1010px,100vw);z-index:40;background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.18);display:flex;flex-direction:column}
.drawer[hidden]{display:none}
.drawer header{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:0;font-size:17px}
.drawer header .sub{color:var(--muted);font-size:12.5px}
.drawer .scroll{overflow:auto;padding:14px 16px 40px}
.preview{border:1px solid var(--line);border-radius:8px;overflow:hidden;height:630px;background:var(--bg)}
.preview iframe{width:1280px;height:840px;border:0;transform:scale(.75);transform-origin:0 0;background:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.sec{margin-top:16px}
.sec h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 6px}
.qcard{border:1px solid var(--line);border-left:4px solid var(--open);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.qcard.block{border-left-color:var(--block)} .qcard.dec{border-left-color:var(--dec)}
.qcard .h{font-weight:650}
.qcard dl{margin:6px 0 0;display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:13px}
.qcard dt{color:var(--muted)}
.qcard dd{margin:0}
.qcard .src{font-size:11.5px;color:var(--faint);margin-top:6px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12px;background:var(--bg)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:39}
.scrim[hidden]{display:none}
.hidepins .pin.open,.hidepins .pin.dec,.hidepins .q.nb{display:none}
@media (max-width:640px){
  .step{width:180px;margin:10px 8px}
  .step .thumb{height:106px}
  .step .thumb iframe{transform:scale(.28125)}
  .preview{height:260px}
  .preview iframe{transform:scale(.3)}
  .qcard dl{grid-template-columns:1fr}
}
/* embed mode: the maps alone, inside a host page's iframe */
body.embed .top{display:none}
body.embed main{padding:8px 4px 16px;max-width:none}
body.embed section.proc{margin:0 0 22px}
body.embed section.proc h2{margin:6px 0 4px;font-size:15px}
body.embed section.proc .lede{margin:0 0 8px;font-size:13px}
body.embed .step.sel{outline:3px solid var(--accent);outline-offset:1px}
</style>

<body>
<header class="top">
  <div class="crumb"><a href="#/">Process map</a><span class="app" id="crumb"></span></div>
  <div class="ctl">
    <label class="toggle" title="Show only questions that block the build"><input type="checkbox" id="blockOnly"> Blocking only</label>
    <a class="btn" id="protolink" href="#" hidden title="All wireframes as one clickable prototype">Wireframes</a>
    <button class="btn" id="theme" type="button" title="Switch light or dark">Theme</button>
  </div>
</header>
<main id="view"></main>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-live="polite"></aside>
<script>
(function(){
'use strict';
var D = "__DATA__";
var HIDE = '[class^="wf-"],[class*=" wf-"],table.bind,table.bt,.anno,.annot,.anno-wrap,.rail-note{display:none!important}';
var EMBED = !!D.embed;
if (EMBED) document.body.classList.add('embed');
var view = document.getElementById('view'), drawer = document.getElementById('drawer'), scrim = document.getElementById('scrim');
var root = document.documentElement;
function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v);}catch(e){ return null; } }
var th = store('pb-theme'); if (th==='light'||th==='dark') root.setAttribute('data-theme', th);
document.getElementById('theme').onclick = function(){
  var cur = root.getAttribute('data-theme') || 'light';
  var nx = cur==='dark' ? 'light' : 'dark'; root.setAttribute('data-theme', nx); store('pb-theme', nx);
  Array.prototype.forEach.call(document.querySelectorAll('iframe[data-page]'), function(f){ f.srcdoc = srcdoc(f.getAttribute('data-page')); });
};
var blockOnly = document.getElementById('blockOnly');
blockOnly.checked = store('pb-block') === '1';
function applyFilter(){ document.body.classList.toggle('hidepins', blockOnly.checked); store('pb-block', blockOnly.checked?'1':'0'); }
blockOnly.onchange = function(){ applyFilter(); route(); };
applyFilter();
document.getElementById('crumb').textContent = D.app ? D.app : '';
if (D.protoHref){ var pl = document.getElementById('protolink'); pl.href = D.protoHref; pl.hidden = false; }

function h(tag, attrs, kids){
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs){ var v = attrs[k]; if (v==null||v===false) continue;
    if (k==='class') e.className = v; else if (k==='text') e.textContent = v; else if (k==='html') e.innerHTML = v;
    else if (k.slice(0,2)==='on') e[k] = v; else if (k==='style') e.style.cssText = v; else e.setAttribute(k, v); }
  (kids||[]).forEach(function(c){ if (c==null) return; e.appendChild(typeof c==='string' ? document.createTextNode(c) : c); });
  return e;
}
var laneById = {}; D.lanes.forEach(function(l,i){ l.i=i; laneById[l.id]=l; });
var stepById = {}, procOf = {};
D.processes.forEach(function(p){ p.steps.forEach(function(s, i){ s.n = i+1; stepById[s.id]=s; procOf[s.id]=p; }); });
var itemById = {}; D.items.forEach(function(it){ itemById[it.id]=it; });
// pins per step: anchored to the step, or to the screen the step shows
var pinsOf = {}, pageItems = {};
D.items.forEach(function(it){
  it.targets.forEach(function(t){
    if (t.type==='step') (pinsOf[t.step]=pinsOf[t.step]||[]).push(it);
    if (t.type==='page') (pageItems[t.page]=pageItems[t.page]||[]).push(it);
  });
});
function itemsForStep(s){
  var seen = {}, out = [];
  (pinsOf[s.id]||[]).concat(s.page ? (pageItems[s.page]||[]) : []).forEach(function(it){ if(!seen[it.id]){ seen[it.id]=1; out.push(it);} });
  return out;
}
function cls(it){ return it.kind==='decision' ? 'dec' : (it.blocking ? 'block' : 'open'); }
function counts(list){ var c={block:0,open:0,dec:0}; list.forEach(function(it){ c[cls(it)]++; }); return c; }
function pinBadges(list){
  var c = counts(list), box = h('div',{class:'pins'});
  if (c.block) box.appendChild(h('span',{class:'pin block',title:c.block+' blocking question(s)',text:String(c.block)}));
  if (c.open) box.appendChild(h('span',{class:'pin open',title:c.open+' open question(s)',text:String(c.open)}));
  if (c.dec) box.appendChild(h('span',{class:'pin dec',title:c.dec+' assumption(s)',text:String(c.dec)}));
  return box;
}
function srcdoc(page){
  var w = D.wireframes[page]; if (!w) return '';
  var html = w.html.replace('<!--css-->', '').replace(/<head([^>]*)>/i, '<head$1><style>'+D.ds+'\n'+HIDE+'</style>');
  if (!/<head/i.test(html)) html = '<style>'+D.ds+'\n'+HIDE+'</style>' + html;
  var dark = root.getAttribute('data-theme')==='dark';
  html = html.replace(/<html([^>]*)>/i, function(m, a){
    a = a.replace(/\s*data-theme="[^"]*"/i,'').replace(/class="([^"]*)"/i, function(c, v){ return 'class="'+v.replace(/\btheme-dark\b/g,'').trim()+'"'; });
    return dark ? '<html'+a.replace(/class="([^"]*)"/i,'class="$1 theme-dark"')+(/class=/i.test(a)?'':' class="theme-dark"')+' data-theme="dark">' : '<html'+a+' data-theme="light">';
  });
  return html;
}
function frame(page){ var f = h('iframe',{sandbox:'allow-same-origin',loading:'eager','data-page':page,title:'Screen '+((D.wireframes[page]||{}).short||page),tabindex:'-1'}); f.srcdoc = srcdoc(page); return f; }
function shortPage(p){ return String(p||'').split('.').pop(); }
function legend(){
  return h('div',{class:'legend'},[
    h('span',null,[h('i',{class:'dot block'}),'Open question that blocks the build']),
    h('span',null,[h('i',{class:'dot open'}),'Open question']),
    h('span',null,[h('i',{class:'dot dec'}),'Assumption we made (please confirm)']),
    h('span',null,['Dashed card: the system does this, no screen']),
    h('span',null,['◇ a decision'])
  ]);
}
function whereLabel(it){
  return it.targets.map(function(t){
    if (t.type==='step'){ var s=stepById[t.step]; return procOf[t.step].id+' step '+s.n; }
    if (t.type==='page') return 'screen '+shortPage(t.page);
    return 'general: '+t.bucket;
  }).join(', ') || 'not placed yet';
}
function qrow(it){
  var b = h('button',{class:'q'+(it.kind==='decision'||!it.blocking?' nb':''),type:'button',onclick:function(){ openItem(it); }},[
    h('i',{class:'dot '+cls(it)}),
    h('div',null,[h('div',{class:'qt'},[it.title, h('span',{class:'tag',text:it.id})]), h('div',{class:'qs',text: it.kind==='decision' ? 'Assumption' : (it.text.length>it.title.length+4 ? it.text : '')})]),
    h('div',{class:'where',text:whereLabel(it)})
  ]);
  return b;
}

// ---------- index ----------
function howto(big, small){
  return h('div',{class:'howto'},[h('span',{class:'hand',text:'\uD83D\uDC46'}), h('div',null,[big, h('small',{text:small})])]);
}
function renderIndex(){
  view.innerHTML = '';
  var nQ = D.items.filter(function(i){return i.kind==='question';}).length, nD = D.items.length - nQ;
  var nB = D.items.filter(function(i){return i.blocking;}).length;
  var nSteps = 0; D.processes.forEach(function(p){ nSteps += p.steps.length; });
  view.appendChild(h('h1',{text:(D.app?D.app+': ':'')+'how the work flows'}));
  view.appendChild(h('p',{class:'lede',text:'Each map below is one business process. Rows are the people (and the system) doing the work, cards are the steps in order, and each card shows the screen where the step happens. Coloured pins mark the open questions and our assumptions, stuck to the step they change. Click a map to open it, click a step to see its screen and its questions.'}));
  view.appendChild(howto('Click a process card to open its map','Each map shows the steps, the screen for each step and the questions pinned to it.'));
  view.appendChild(legend());
  var st = h('div',{class:'stats'});
  [[D.processes.length,'processes'],[nSteps,'steps'],[Object.keys(D.wireframes).length,'screens shown'],[nQ,'open questions'],[nB,'block the build'],[nD,'assumptions to confirm']].forEach(function(x,i){
    st.appendChild(h('div',{class:'stat'+(i===4&&x[0]?' warn':'')},[h('b',{text:String(x[0])}),h('span',{text:x[1]})]));
  });
  if (D.stats.unanchored) st.appendChild(h('div',{class:'stat warn'},[h('b',{text:String(D.stats.unanchored)}),h('span',{text:'not placed yet'})]));
  view.appendChild(st);
  view.appendChild(h('h2',{text:'Processes'}));
  var cards = h('div',{class:'cards'});
  D.processes.forEach(function(p){
    var all = []; p.steps.forEach(function(s){ all = all.concat(itemsForStep(s)); });
    var uniq = {}; all = all.filter(function(it){ if(uniq[it.id]) return false; uniq[it.id]=1; return true; });
    var c = counts(all);
    var laneIds = []; p.steps.forEach(function(s){ if (laneIds.indexOf(s.lane)<0) laneIds.push(s.lane); });
    laneIds.sort(function(a,b){ return laneById[a].i-laneById[b].i; });
    var cols = 0; p.steps.forEach(function(s){ cols = Math.max(cols, s.col+1); });
    var mini = h('div',{class:'mini',style:'grid-template-columns:90px repeat('+cols+',1fr)'});
    laneIds.forEach(function(lid){
      mini.appendChild(h('em',{text:laneById[lid].label}));
      for (var ci=0; ci<cols; ci++){
        var s = p.steps.filter(function(x){ return x.lane===lid && x.col===ci; })[0];
        var hot = s && itemsForStep(s).some(function(it){ return it.blocking; });
        mini.appendChild(h('i',{class: s ? 'on'+(s.kind==='system'||s.kind==='end'?' sys':'')+(s.kind==='decision'?' dec':'')+(hot?' hot':'') : ''}));
      }
    });
    var pins = h('span',{class:'pinrow'});
    if (c.block) pins.appendChild(h('span',{class:'pc block'},[h('i',{class:'dot block'}),String(c.block)]));
    if (c.open && !blockOnly.checked) pins.appendChild(h('span',{class:'pc open'},[h('i',{class:'dot open'}),String(c.open)]));
    if (c.dec && !blockOnly.checked) pins.appendChild(h('span',{class:'pc dec'},[h('i',{class:'dot dec'}),String(c.dec)]));
    cards.appendChild(h('a',{class:'card',href:'#/'+encodeURIComponent(p.id)},[
      h('h3',{text:p.title}), p.summary ? h('p',{text:p.summary}) : null, mini,
      h('div',{class:'meta'},[h('span',{text:p.steps.length+' steps'}), h('span',{text:laneIds.map(function(l){return laneById[l].label;}).join(', ')}), pins]),
      h('div',{class:'opencue',text:'Open map \u203A'})
    ]));
  });
  view.appendChild(cards);
  // items with no step: page pins on screens no process shows, global buckets, unanchored
  var offStep = D.items.filter(function(it){
    return !it.targets.length || it.targets.every(function(t){ return t.type==='global' || (t.type==='page' && !D.processes.some(function(p){ return p.steps.some(function(s){ return s.page===t.page; }); })); });
  });
  if (offStep.length){
    view.appendChild(h('h2',{text:'Questions and assumptions not tied to one step ('+offStep.length+')'}));
    view.appendChild(h('p',{class:'lede',text:'These apply to the whole app or to one kind of data, not to a single moment in a process. They are grouped by topic.'}));
    var groups = {};
    offStep.forEach(function(it){
      var g = it.targets.length ? (it.targets[0].type==='global' ? it.targets[0].bucket : 'Screen '+shortPage(it.targets[0].page)) : 'Not placed yet';
      (groups[g]=groups[g]||[]).push(it);
    });
    Object.keys(groups).sort().forEach(function(g){
      var l = h('div',{class:'qlist'}); groups[g].forEach(function(it){ l.appendChild(qrow(it)); });
      var d = h('details',{class:'more'},[h('summary',{text:g+' ('+groups[g].length+')'}), l]);
      if (groups[g].some(function(it){ return it.blocking; }) || Object.keys(groups).length===1) d.open = true;
      view.appendChild(d);
    });
  }
  if (D.standalone.length){
    var t = h('table',{class:'uc'});
    D.standalone.forEach(function(s){ t.appendChild(h('tr',null,[h('td',{class:'mono',text:s.useCase}),h('td',{text:D.useCases[s.useCase]||''}),h('td',{style:'color:var(--muted)',text:s.reason})])); });
    view.appendChild(h('details',{class:'more'},[h('summary',{text:'Use cases that are not part of a process ('+D.standalone.length+')'}), t]));
  }
}

// ---------- one process ----------
function renderProcess(p, host){
  var emb = !!host; host = host || view;
  if (!emb){
    view.innerHTML = '';
    view.appendChild(h('p',{style:'margin:0'},[h('a',{href:'#/',text:'← All processes'})]));
    view.appendChild(h('h1',{text:p.title}));
    if (p.summary) view.appendChild(h('p',{class:'lede',text:p.summary}));
    view.appendChild(howto('Click any step card to see its screen large and the questions about it','Coloured pins count the questions on that step. Scroll sideways to follow the process.'));
    view.appendChild(legend());
  }
  var laneIds = []; p.steps.forEach(function(s){ if (laneIds.indexOf(s.lane)<0) laneIds.push(s.lane); });
  laneIds.sort(function(a,b){ return laneById[a].i-laneById[b].i; });
  var cols = 0; p.steps.forEach(function(s){ cols = Math.max(cols, s.col+1); });
  var wrap = h('div',{class:'boardwrap'});
  var board = h('div',{class:'board'+(p.steps.length>12?' long':''),style:'grid-template-columns:150px repeat('+cols+',auto);grid-template-rows:repeat('+laneIds.length+',auto)'});
  var svgNS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(svgNS,'svg'); svg.setAttribute('class','edges');
  board.appendChild(svg);
  var lsvg = document.createElementNS(svgNS,'svg'); lsvg.setAttribute('class','edges labels'); board.appendChild(lsvg);
  laneIds.forEach(function(lid, r){
    var l = laneById[lid];
    board.appendChild(h('div',{class:'laneband k-'+l.kind,style:'grid-row:'+(r+1)}));
    var kindTxt = {system:'automatic',scheduled:'scheduled job',external:'outside system'}[l.kind] || '';
    board.appendChild(h('div',{class:'lanelabel',style:'grid-row:'+(r+1)+';grid-column:1'},[h('div',null,[l.label, kindTxt?h('small',{text:kindTxt}):null])]));
  });
  var el = {};
  p.steps.forEach(function(s){
    var r = laneIds.indexOf(s.lane)+1;
    var items = itemsForStep(s);
    var kids = [pinBadges(items)];
    // an embedded pass-1 map has no screens at all: a grey "no wireframe" box per step is only noise there
    if (s.kind==='task' && !(EMBED && !Object.keys(D.wireframes).length)){
      kids.push(h('div',{class:'thumb'},[ s.page && D.wireframes[s.page] ? frame(s.page) : h('div',{class:'nowf',text: (s.page ? 'No wireframe yet' : 'No screen yet') + (typeof s.pageMissing==='string' ? ': '+s.pageMissing : '')}) ]));
    }
    var body = h('div',{class:'body'},[
      h('div',{class:'n',text:'Step '+s.n+(s.kind==='system'?' · automatic':'')}),
      h('div',{class:'t',text:s.title}),
      s.page ? h('div',{class:'pg',text:shortPage(s.page)}) : null,
      s.kind!=='task' && s.does ? h('div',{class:'does',text:s.does}) : null,
      s.status ? h('span',{class:'status',text:s.status}) : null,
      h('div',{class:'opencue',text:(items.length?items.length+' question'+(items.length>1?'s':'')+' \u00B7 ':'')+'Open \u203A'})
    ]);
    s.next.forEach(function(n){ if (procOf[n.to] && procOf[n.to]!==p) body.appendChild(h('a',{class:'xlink',href:'#/'+encodeURIComponent(procOf[n.to].id),onclick:function(e){e.stopPropagation();},text:'continues in: '+procOf[n.to].title+' →'})); });
    kids.push(body);
    var card = h('button',{type:'button',class:'step k-'+s.kind,style:'grid-row:'+r+';grid-column:'+(s.col+2),'data-step':s.id,onclick:function(){ if (EMBED) pickStep(s); else openStep(s); }}, kids);
    el[s.id] = card; board.appendChild(card);
  });
  wrap.appendChild(board); host.appendChild(wrap);
  if (!EMBED && store('pb-clicked')!=='1'){ var first = board.querySelector('.step'); if (first) first.classList.add('pulse'); }
  // A long process is scaled to fit the box (not below 50%); past that it scrolls inside the box only.
  function fit(){
    if (!board.classList.contains('long')) return;
    board.style.zoom = 1;
    var z = Math.max(0.5, Math.min(1, (wrap.clientWidth - 4) / board.scrollWidth));
    board.style.zoom = z;
  }
  function draw(){
    fit();
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var defs = document.createElementNS(svgNS,'defs');
    defs.innerHTML = '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--edge)"/></marker>';
    svg.appendChild(defs);
    var bw = board.scrollWidth, bh = board.scrollHeight;
    while (lsvg.firstChild) lsvg.removeChild(lsvg.firstChild);
    [svg,lsvg].forEach(function(g){ g.setAttribute('viewBox','0 0 '+bw+' '+bh); g.style.width = bw+'px'; g.style.height = bh+'px'; });
    var R = function(e){ return {x:e.offsetLeft, y:e.offsetTop, w:e.offsetWidth, h:e.offsetHeight}; };
    var backLane = 0;
    p.steps.forEach(function(s){
      s.next.forEach(function(n){
        var t = stepById[n.to]; if (!el[n.to] || procOf[n.to]!==p) return;
        var a = R(el[s.id]), b = R(el[n.to]), d, lx, ly, back = false;
        if (t.col > s.col){
          var sx=a.x+a.w, sy=a.y+a.h/2, tx=b.x, ty=b.y+b.h/2, mx=sx+(tx-sx)/2;
          var skipped = p.steps.filter(function(o){ return o.lane===s.lane && o.lane===t.lane && o.col>s.col && o.col<t.col && el[o.id]; });
          if (skipped.length) {
            // same lane with cards in between: a straight line would read as "goes to the next card", so pass under them
            var low = Math.max.apply(null, [a, b].concat(skipped.map(function(o){ return R(el[o.id]); })).map(function(r){ return r.y+r.h; })) + 12;
            var x1 = a.x+a.w/2, x2 = b.x+b.w/2;
            d='M'+x1+','+(a.y+a.h)+' V'+low+' H'+x2+' V'+(b.y+b.h+2); lx=(x1+x2)/2; ly=low+4;
          } else if (Math.abs(sy-ty)<2) { d='M'+sx+','+sy+' H'+(tx-2); lx=mx; ly=sy-8; }
          else { mx = tx-14; d='M'+sx+','+sy+' H'+(mx-8)+' Q'+mx+','+sy+' '+mx+','+(sy+(ty>sy?8:-8))+' V'+(ty+(ty>sy?-8:8))+' Q'+mx+','+ty+' '+(mx+8)+','+ty+' H'+(tx-2); lx=mx; ly=(sy+ty)/2+4; }
        } else if (t.col === s.col){
          var down = b.y > a.y, x = a.x+a.w/2;
          d='M'+x+','+(down?a.y+a.h:a.y)+' V'+(down?b.y-2:b.y+b.h+2); lx=x+28; ly=(down?a.y+a.h+b.y:a.y+b.y+b.h)/2;
        } else {
          back = true; backLane++;
          var top = 8 + (backLane%3)*7, x1=a.x+a.w/2+10, x2=b.x+b.w/2-10;
          d='M'+x1+','+a.y+' V'+top+' H'+x2+' V'+(b.y-2); lx=(x1+x2)/2; ly=top+4;
        }
        var path = document.createElementNS(svgNS,'path'); path.setAttribute('d',d); path.setAttribute('class','edge'+(back?' back':'')); path.setAttribute('marker-end','url(#ah)');
        svg.appendChild(path);
        if (n.label){
          var tx2 = document.createElementNS(svgNS,'text'); tx2.setAttribute('class','elabel'); tx2.setAttribute('x',lx); tx2.setAttribute('y',ly); tx2.setAttribute('text-anchor','middle'); tx2.textContent = n.label;
          lsvg.appendChild(tx2);
          var bb = tx2.getBBox(); var bg = document.createElementNS(svgNS,'rect');
          bg.setAttribute('x',bb.x-4); bg.setAttribute('y',bb.y-1); bg.setAttribute('width',bb.width+8); bg.setAttribute('height',bb.height+2); bg.setAttribute('rx',4); bg.setAttribute('class','elabelbg');
          lsvg.insertBefore(bg, tx2);
        }
      });
    });
  }
  requestAnimationFrame(draw);
  if (window.ResizeObserver) new ResizeObserver(function(){ draw(); }).observe(board);
  if (emb) return;
  // the list under the map: every question on this process, in step order
  var seen = {}, list = [];
  p.steps.forEach(function(s){ itemsForStep(s).forEach(function(it){ if(!seen[it.id]){ seen[it.id]=1; list.push(it);} }); });
  list.sort(function(a,b){ var o={block:0,open:1,dec:2}; return o[cls(a)]-o[cls(b)]; });
  view.appendChild(h('h2',{text:'Questions and assumptions on this process ('+list.length+')'}));
  var ql = h('div',{class:'qlist'}); list.forEach(function(it){ ql.appendChild(qrow(it)); }); view.appendChild(ql);
}

// ---------- drawer ----------
function closeDrawer(){ drawer.hidden = true; scrim.hidden = true; Array.prototype.forEach.call(document.querySelectorAll('.step.sel'), function(e){ e.classList.remove('sel'); }); }
scrim.onclick = closeDrawer;
document.addEventListener('keydown', function(e){ if (e.key==='Escape') closeDrawer(); });
function shell(title, sub){
  drawer.innerHTML = ''; drawer.hidden = false; scrim.hidden = false;
  var body = h('div',{class:'scroll'});
  drawer.appendChild(h('header',null,[h('div',null,[h('h2',{text:title}), sub?h('div',{class:'sub',text:sub}):null]), h('button',{class:'btn',type:'button',onclick:closeDrawer,text:'Close'})]));
  drawer.appendChild(body); return body;
}
function qcard(it, withWhere){
  var dl = h('dl');
  if (it.kind==='question'){
    dl.appendChild(h('dt',{text:'Question'})); dl.appendChild(h('dd',{text:it.text}));
    if (it.assumption){ dl.appendChild(h('dt',{text:'We assume'})); dl.appendChild(h('dd',{text:it.assumption})); }
  } else { dl.appendChild(h('dt',{text:'Assumption'})); dl.appendChild(h('dd',{text:it.text})); }
  if (it.risk){ dl.appendChild(h('dt',{text:'If wrong'})); dl.appendChild(h('dd',{text:it.risk})); }
  if (it.askWho){ dl.appendChild(h('dt',{text:'Ask'})); dl.appendChild(h('dd',{text:it.askWho})); }
  if (withWhere){ dl.appendChild(h('dt',{text:'Where'})); var dd=h('dd');
    it.targets.forEach(function(t,i){ if(i) dd.appendChild(document.createTextNode(', '));
      if (t.type==='step') dd.appendChild(h('a',{href:'#/'+encodeURIComponent(procOf[t.step].id),onclick:function(){ setTimeout(function(){ openStep(stepById[t.step]); },60); },text:procOf[t.step].title+', step '+stepById[t.step].n+' ('+stepById[t.step].title+')'}));
      else dd.appendChild(document.createTextNode(t.type==='page' ? 'screen '+shortPage(t.page) : 'general: '+t.bucket)); });
    if (!it.targets.length) dd.textContent = 'not placed yet'; dl.appendChild(dd); }
  return h('div',{class:'qcard '+cls(it)+(it.kind==='decision'||!it.blocking?' nbq':'')},[
    h('div',{class:'h'},[ (it.blocking?'Blocks the build: ':'') + it.title, h('span',{class:'tag',text:it.id})]), dl,
    h('div',{class:'src',text:(it.anchoredBy==='judged'?'Placed by review':'Placed from the requirements')+(it.basis?' ('+it.basis+')':'')})
  ]);
}
function openStep(s){
  store('pb-clicked','1'); Array.prototype.forEach.call(document.querySelectorAll('.step.pulse'), function(e){ e.classList.remove('pulse'); });
  Array.prototype.forEach.call(document.querySelectorAll('.step.sel'), function(e){ e.classList.remove('sel'); });
  var c = document.querySelector('.step[data-step="'+s.id+'"]'); if (c) c.classList.add('sel');
  var p = procOf[s.id], lane = laneById[s.lane];
  var b = shell('Step '+s.n+': '+s.title, p.title+' · '+lane.label);
  if (s.page && D.wireframes[s.page]){
    b.appendChild(h('div',{class:'preview'},[frame(s.page)]));
    var acts = h('div',{class:'actions'});
    acts.appendChild(h('button',{class:'btn',type:'button',text:'Open screen full size',onclick:function(){
      var esc = srcdoc(s.page).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
      var wrap = '<!doctype html><meta charset="utf-8"><title>'+shortPage(s.page).replace(/[<&]/g,'')+'</title><body style="margin:0"><iframe sandbox="allow-same-origin" style="border:0;width:100vw;height:100vh" srcdoc="'+esc+'"></iframe>';
      var url = URL.createObjectURL(new Blob([wrap],{type:'text/html'})); window.open(url,'_blank'); }}));
    if (D.protoHref) acts.appendChild(h('a',{class:'btn primary',href:D.protoHref+'#/'+D.wireframes[s.page].route,target:'_blank',text:'Try it in the clickable prototype'}));
    b.appendChild(acts);
  } else if (s.page){
    b.appendChild(h('p',{class:'lede',text:'Screen '+shortPage(s.page)+' has no wireframe yet'+(typeof s.pageMissing==='string'?': '+s.pageMissing:'.')}));
  }
  if (s.does || s.status){
    var sec = h('div',{class:'sec'},[h('h3',{text:'What happens'})]);
    if (s.does) sec.appendChild(h('p',{style:'margin:0 0 6px',text:s.does}));
    if (s.status) sec.appendChild(h('span',{class:'status',text:'Status: '+s.status}));
    b.appendChild(sec);
  }
  if (s.next.length){
    var nx = h('div',{class:'sec'},[h('h3',{text:'Next'})]);
    var ul = h('div',{class:'chips'});
    s.next.forEach(function(n){ var t = stepById[n.to]; ul.appendChild(h('a',{class:'chip',href:'#/'+encodeURIComponent(procOf[n.to].id),onclick:function(){ setTimeout(function(){ openStep(t); },60); },text:(n.label?n.label+': ':'')+(procOf[n.to]!==p?procOf[n.to].title+', ':'')+'step '+t.n+' '+t.title})); });
    nx.appendChild(ul); b.appendChild(nx);
  }
  var items = itemsForStep(s);
  var qs = h('div',{class:'sec'},[h('h3',{text:items.length ? 'Questions and assumptions here ('+items.length+')' : 'No open questions on this step'})]);
  items.sort(function(a,c2){ var o={block:0,open:1,dec:2}; return o[cls(a)]-o[cls(c2)]; }).forEach(function(it){
    var card = qcard(it, false); if (blockOnly.checked && !it.blocking) card.style.display='none'; qs.appendChild(card); });
  b.appendChild(qs);
  var tech = h('details',{class:'more'},[h('summary',{text:'Technical details (for the build team)'})]);
  var t = h('table',{class:'uc'});
  s.useCases.forEach(function(u){ t.appendChild(h('tr',null,[h('td',{class:'mono',text:u}),h('td',{text:D.useCases[u]||''})])); });
  if (s.actions.length) t.appendChild(h('tr',null,[h('td',{text:'Microflows'}),h('td',{class:'mono',text:s.actions.join(', ')})]));
  if (s.events.length) t.appendChild(h('tr',null,[h('td',{text:'Events'}),h('td',{class:'mono',text:s.events.join(', ')})]));
  if (s.page) t.appendChild(h('tr',null,[h('td',{text:'Page'}),h('td',{class:'mono',text:s.page})]));
  if (s.note) t.appendChild(h('tr',null,[h('td',{text:'Note'}),h('td',{text:s.note})]));
  t.appendChild(h('tr',null,[h('td',{text:'Step id'}),h('td',{class:'mono',text:s.id})]));
  tech.appendChild(t); b.appendChild(tech);
}
function openItem(it){
  var b = shell(it.title, (it.kind==='decision'?'Assumption ':'Question ')+it.id);
  b.appendChild(qcard(it, true));
}

// ---------- embed (host page iframe) ----------
// The host page (bin/brd-report.sh) lists requirements and questions under the map. A click on a
// step tells it which step; the host answers with a select so the card stays highlighted.
function markStep(id){
  Array.prototype.forEach.call(document.querySelectorAll('.step.sel'), function(e){ e.classList.remove('sel'); });
  if (id){ var c = document.querySelector('.step[data-step="'+id+'"]'); if (c) c.classList.add('sel'); }
}
function pickStep(s){ markStep(s.id); try{ parent.postMessage({pm:'step', step:s.id, proc:procOf[s.id].id}, '*'); }catch(e){} }
function sendHeight(){ try{ parent.postMessage({pm:'height', h:Math.ceil(view.getBoundingClientRect().bottom + (window.pageYOffset||0)) + 12}, '*'); }catch(e){} }
function renderEmbed(){
  view.className = 'wide'; view.innerHTML = '';
  view.appendChild(legend());
  D.processes.forEach(function(p){
    var sec = h('section',{class:'proc','data-proc':p.id},[h('h2',{text:p.title}), p.summary ? h('p',{class:'lede',text:p.summary}) : null]);
    view.appendChild(sec); renderProcess(p, sec);
  });
  window.addEventListener('message', function(e){ var d = e.data||{}; if (d.pm==='select') markStep(d.step); });
  if (window.ResizeObserver) new ResizeObserver(sendHeight).observe(view);
  sendHeight(); window.addEventListener('load', sendHeight);
  try{ parent.postMessage({pm:'ready'}, '*'); }catch(e){}
}

// ---------- routing ----------
function route(){
  var id = decodeURIComponent((location.hash||'').replace(/^#\/?/, ''));
  var p = D.processes.filter(function(x){ return x.id===id; })[0];
  closeDrawer();
  view.className = p ? 'wide' : '';
  if (p){ renderProcess(p); document.title = p.title+' · process map'; }
  else { renderIndex(); document.title = (D.app?D.app+' ':'')+'process map'; }
  window.scrollTo(0,0);
}
if (EMBED) renderEmbed();
else { window.addEventListener('hashchange', route); route(); }
})();
